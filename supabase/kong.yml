_format_version: "2.1"
services:
- name: "rest"
  url: "http://rest:3000"
  routes:
  - name: "rest"
    paths:
    - "/"
- name: "auth"
  url: "http://auth:9999"
  routes:
  - name: "auth"
    paths:
    - "/auth/v1"
- name: "storage"
  url: "http://storage:5000"
  routes:
  - name: "storage"
    paths:
    - "/storage/v1"
- name: "meta"
  url: "http://meta:8080"
  routes:
  - name: "meta"
    paths:
    - "/rest/v1/meta"
